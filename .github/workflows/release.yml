name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm trusts only this workflow running in the npm environment (trusted
    # publishing, no token). The environment requires a reviewer's approval
    # (Settings > Environments > npm), so a tag push alone cannot publish.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: npm run typecheck
      - name: dist matches the build
        run: |
          npm run build
          git diff --exit-code --stat -- dist
          test -z "$(git status --porcelain -- dist)"
      - name: Unit tests
        run: bun test test/
      - name: Check tag matches package version
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # dist was built and checked above; skip lifecycle scripts during publish.
      # npm 11.5.1+ authenticates with the job's OIDC token; NPM_TOKEN is not used.
      - run: npm publish --provenance --access public --ignore-scripts
